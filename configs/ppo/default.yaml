# The single PPO config for every condition (R1). Values copied from Playground's reference
# for Go1JoystickFlatTerrain (mujoco_playground 0.2.0, config/locomotion_params.py
# brax_ppo_config) and Brax PPO defaults it relies on (brax 0.14.2); see D20.
# Brax's batch_size × num_minibatches (256 × 32) = num_envs here: one 20-step unroll per env
# per iteration, split into 32 minibatches of 256 env-sequences.
num_envs: 8192
unroll_length: 20
num_minibatches: 32
num_updates_per_batch: 4      # epochs per rollout
discounting: 0.97
gae_lambda: 0.95              # Brax default
advantage_estimator: brax     # Brax's r + γ·vs' − V (latrl/ppo/gae.py; D20). Alternative: gae
learning_rate: 3.0e-4         # constant
entropy_cost: 0.01
clipping_epsilon: 0.3         # Brax default (not overridden for Go1 joystick)
vf_coefficient: 0.5           # Brax default; value loss = 0.5 · vf_coefficient · MSE
max_grad_norm: 1.0
reward_scaling: 1.0
normalize_advantage: true
normalize_observations: true
min_std: 0.001                # tanh-normal: scale = softplus(raw) + min_std
value_hidden: [512, 256, 128] # critic MLP on privileged_state, identical for all conditions (D23)
episode_length: 1000          # 20 s
