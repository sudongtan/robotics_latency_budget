[project]
name = "latrl"
version = "0.1.0"
description = "Latency robustness in learned quadruped locomotion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco",
    "mujoco-mjx",
    "playground",
    "jax",
    "flax",
    "optax",
    "hydra-core",
    "omegaconf",
    "wandb",
    "rliable",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "mediapy",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latrl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
